services:
  outpaint:
    build:
      context: .
    image: krea2-infinite-outpaint
    container_name: krea2-infinite-outpaint
    gpus: all
    ports:
      - "${PUBLIC_PORT:-7860}:${APP_PORT:-7860}"
    environment:
      APP_PORT: ${APP_PORT:-7860}
    volumes:
      - ./frames:/app/frames
    restart: unless-stopped
